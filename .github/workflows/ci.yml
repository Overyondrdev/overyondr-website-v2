name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token for every job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs (version in the comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/secret-scan.mjs # no API keys, tokens or private keys in tracked files
      - run: npm run format:check
      - run: npm run build # astro check + build + Squarespace-CDN check
      - run: npm run check:links
      - name: Worker syntax and bundle
        run: |
          node --check worker/index.js
          node --check worker/yondr-session.js
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      # worker/yondr-session.js must stay identical to the sign-in's source of truth (docs/PLATFORM.md in v1).
      - name: Session check matches overyondr-website-v1/auth/src/session.js
        run: |
          curl -fsSL https://raw.githubusercontent.com/Overyondrdev/overyondr-website-v1/main/auth/src/session.js -o "$RUNNER_TEMP/session.js"
          cmp "$RUNNER_TEMP/session.js" worker/yondr-session.js || {
            echo "::error file=worker/yondr-session.js::Differs from overyondr-website-v1 auth/src/session.js. Copy it over unchanged."
            exit 1
          }

  # Launch-quality gates for V2 (README "Launch quality"): SEO hygiene, redirects, axe-core accessibility at 1280px
  # and 375px, and Lighthouse CI budgets. Each check runs even if an earlier one fails; reports are kept as an
  # artifact (never uploaded to a public Lighthouse server: this repository is public).
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking for now. TODO: make blocking before launch (remove continue-on-error).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: SEO hygiene
        run: npm run quality:seo
      - name: Redirects
        if: ${{ !cancelled() }}
        run: npm run quality:redirects
      - name: Accessibility (axe-core)
        if: ${{ !cancelled() }}
        run: npm run quality:a11y
      - name: Lighthouse CI
        if: ${{ !cancelled() }}
        run: npm run quality:lighthouse
      - name: Keep Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

# Deploys are handled by Cloudflare Workers Builds (Git integration), not by Actions,
# so no Cloudflare secrets are stored in GitHub.
