# Auto-fix report: tells Yondr Ops (ops.overyondrdev.com) what happened to an automatic-fix pull request, so it can
# verify the deploy (and revert automatically) or tell people it failed. Ops also polls GitHub every 5 minutes as a
# backstop, so a missed report only delays things. No code is checked out or run here.
name: Auto-fix report

on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

env:
  OPS_URL: https://ops.overyondrdev.com

jobs:
  closed:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'autofix/ops-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report merged / closed
        env:
          OPS_TOKEN: ${{ secrets.OPS_INGEST_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGED: ${{ github.event.pull_request.merged }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          id=$(printf '%s' "$HEAD_REF" | sed -nE 's#^autofix/ops-([0-9]{1,9})$#\1#p')
          [ -n "$id" ] && [ -n "$OPS_TOKEN" ] || { echo "Nothing to report."; exit 0; }
          if [ "$MERGED" = true ]; then
            body=$(jq -n --argjson id "$id" --arg sha "$MERGE_SHA" --arg pr "$PR_URL" \
              '{id: $id, status: "merged", merge_sha: $sha, pr_url: $pr, actor: "autofix-report", message: ("Merged as " + $sha[0:7] + ". Ops now watches the deploy and the site.")}')
          else
            body=$(jq -n --argjson id "$id" --arg pr "$PR_URL" '{id: $id, status: "failed", pr_url: $pr, actor: "autofix-report", message: "The pull request was closed without merging. A person takes over."}')
          fi
          printf '%s' "$body" | curl -fsS --max-time 20 -X POST -H "X-Ops-Token: $OPS_TOKEN" -H 'content-type: application/json' --data-binary @- "$OPS_URL/api/autofix/events" > /dev/null

  ci-failed:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'autofix/ops-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report failed checks
        env:
          OPS_TOKEN: ${{ secrets.OPS_INGEST_TOKEN }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id=$(printf '%s' "$HEAD_REF" | sed -nE 's#^autofix/ops-([0-9]{1,9})$#\1#p')
          [ -n "$id" ] && [ -n "$OPS_TOKEN" ] || { echo "Nothing to report."; exit 0; }
          pr=""; [ -n "$PR_NUMBER" ] && pr="https://github.com/$REPO/pull/$PR_NUMBER"
          jq -n --argjson id "$id" --arg pr "$pr" --arg run "$RUN_URL" \
            '{id: $id, status: "checks_failed", actor: "autofix-report", message: ("CI failed on the pull request: " + $run + ". It won'"'"'t merge; a person decides.")} + (if $pr == "" then {} else {pr_url: $pr} end)' |
            curl -fsS --max-time 20 -X POST -H "X-Ops-Token: $OPS_TOKEN" -H 'content-type: application/json' --data-binary @- "$OPS_URL/api/autofix/events" > /dev/null
